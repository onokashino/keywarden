# Every push and PR: format, clippy and tests on three systems, extension build.
# The GPUI interface builds only on its own system: DirectX and Metal shaders are
# compiled by Windows and Xcode tools, hence the OS matrix.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: &skip
      # the site, docs and texts do not touch the build
      - 'site/**'
      - 'docs/**'
      - '**.md'
      - 'packaging/**'
      - 'LICENSE'
  pull_request:
    paths-ignore: *skip
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # tests compare Russian messages; i18n::tests::every_key_is_translated checks the translation
  KEYWARDEN_LANG: ru

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --exclude keywarden-ext --all-targets
      - name: tests
        run: cargo test --workspace --exclude keywarden-ext --exclude keywarden-ui
      - name: build
        run: cargo build --release -p keywarden-daemon -p keywarden-cli -p keywarden-host -p keywarden-ui
      - name: binaries start
        shell: bash
        run: target/release/kw --help >/dev/null

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # same version as wasm-bindgen in crates/keywarden-ext/Cargo.toml
          tool: wasm-bindgen@0.2.130
      - run: sh scripts/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - working-directory: extension
        run: |
          npm ci
          npm run check
          npm run zip
