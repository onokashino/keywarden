# Release on a vX.Y.Z tag: builds on three systems, archives, extension, checksums.
# The release is published at once (text from .github/release-notes.md), then packages and extension-stores run.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag, for example v0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: tag matches the version in Cargo.toml and package.json
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          e=$(node -p "require('./extension/package.json').version")
          # prerelease v0.2.0-rc.1 is built from version 0.2.0: Firefox does not accept letters in a version
          [ "v$v" = "${TAG%%-*}" ] || { echo "::error::tag $TAG, but Cargo.toml has $v"; exit 1; }
          [ "$e" = "$v" ] || { echo "::error::extension/package.json has $e, but Cargo.toml has $v"; exit 1; }

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: windows-2022, name: windows-x86_64 }
          - { os: macos-15, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - name: build
        run: cargo build --release --locked -p keywarden-daemon -p keywarden-cli -p keywarden-host -p keywarden-ui
      - name: archive
        shell: bash
        run: |
          d=keywarden-$TAG-${{ matrix.name }}
          mkdir -p "$d"
          x=; [ "$RUNNER_OS" = Windows ] && x=.exe
          for b in keywardend kw keywarden-ui keywarden-host; do cp "target/release/$b$x" "$d/"; done
          cp README.md "$d/"
          if [ "$RUNNER_OS" = Linux ]; then
            cp -r dist scripts/install.sh "$d/"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$d.zip" "$d" >/dev/null
          else
            tar czf "$d.tar.gz" "$d"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # only the archives: the folder keywarden-v0.1.0-... also matches keywarden-*.*
          path: |
            keywarden-*.tar.gz
            keywarden-*.zip
          if-no-files-found: error

  extension:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - run: sh scripts/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - working-directory: extension
        run: npm ci && npm run zip
      - name: sources for AMO (WASM is built from Rust, so the whole repository)
        run: |
          rm extension/.output/*-sources.zip
          git archive --format=zip -o "extension/.output/keywarden-$TAG-sources.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/.output/*.zip
          # .output is a hidden folder, skipped by default
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [build, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{TAG}/$TAG/g" src/.github/release-notes.md > notes.md
          cd out
          sha256sum -- * > SHA256SUMS
          pre=; case "$TAG" in *-*) pre=--prerelease;; esac
          gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" $pre \
            --title "Keywarden $TAG" --notes-file ../notes.md --generate-notes
      # a release made with GITHUB_TOKEN does not fire release: published, so start them here
      - name: packages and stores
        # a prerelease (v0.2.0-rc.1) is for testing only: no package managers, no stores
        if: ${{ !contains(env.TAG, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run packages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          gh workflow run extension-stores.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG" -f dry_run=false
