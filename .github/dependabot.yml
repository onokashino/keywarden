version: 2
# Обновления одним pull request на экосистему раз в месяц: каждый PR гоняет CI на трёх
# системах, и пачка отдельных PR занимает все раннеры.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /extension
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm: { patterns: ["*"] }
