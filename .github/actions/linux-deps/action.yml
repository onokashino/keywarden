name: linux-deps
description: Системные библиотеки для сборки GPUI на Ubuntu
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev \
          libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev \
          libfontconfig-dev libfreetype-dev libdbus-1-dev keepassxc
