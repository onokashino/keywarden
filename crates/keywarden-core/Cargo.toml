[package]
name = "keywarden-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
keepass = { version = "0.17", features = ["save_kdbx4", "_merge", "challenge_response"] }
# keepass-rs строит KdfConfig на rust-argon2, поэтому версия должна совпадать с его
argon2 = { package = "rust-argon2", version = "3" }
thiserror = "2"
zeroize = { version = "1.9", features = ["serde", "zeroize_derive"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
data-encoding = "2"
csv = "1"
regex = "1"
zxcvbn = "3"
# сессии Secret Service (dh-ietf1024-sha256-aes128-cbc-pkcs7)
num-bigint = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
qrcode = { version = "0.14", default-features = false }
url = "2"
nucleo-matcher = "0.3"
rand = "0.10"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
psl = "2"
crypto_box = { version = "0.9", features = ["std"] }
bip39 = "2"
bs58 = { version = "0.5", features = ["check"] }
printpdf = "0.7"
k256 = "0.13"
ripemd = "0.1"
sha3 = "0.10"
bech32 = "0.11"
ed25519-dalek = "2"
# язык системы для перевода интерфейса
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"

# YubiKey challenge-response: в Linux через USB (nusb), на Windows и macOS через системный HID
[target.'cfg(target_os = "linux")'.dependencies]
keepass = { version = "0.17", features = ["save_kdbx4", "_merge", "yubikey_usb"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

# macOS: IOKit напрямую (feature-report-ам хватает шести вызовов), без C-кода hidapi
[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "hid", "libc"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFNumber", "CFDictionary", "CFArray", "CFSet", "CFBase"] }
