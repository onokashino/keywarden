[package]
name = "keywarden-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keywardend"
path = "src/main.rs"

[dependencies]
keywarden-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
data-encoding = "2"
futures-util = "0.3"
keywarden-ext = { path = "../keywarden-ext" }
url = "2"
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["ed25519", "ecdsa", "rsa", "encryption", "p256", "p384", "p521"] }
# генерация ключей ssh-key 0.6 (та же версия rand_core, что у ядра)
rand_core = { version = "0.6", features = ["getrandom"] }
# подпись RSA делаем сами: в ssh-key 0.6.7 ключ собирается из (p, p) вместо (p, q)
rsa = { version = "0.9", features = ["sha2"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"
zeroize = "1"
notify = "8"
keepass = { version = "0.17", features = ["save_kdbx4"] }
# распознавание QR-кодов 2FA со скриншота или картинки
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp"] }
rqrr = "0.9"
# проверка утечек паролей (Have I Been Pwned), только по запросу пользователя
ureq = "2"
chrono = "0.4"

# буфер обмена вне Wayland с data-control: X11, GNOME, macOS, Windows
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Linux: буфер Wayland, logind и Secret Service по D-Bus
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }

# значок в трее: в Linux StatusNotifierItem по D-Bus (ksni), без GTK
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
png = "0.18"

# macOS и Windows: автоввод (набор и активное окно)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
enigo = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
